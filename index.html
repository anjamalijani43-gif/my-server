<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>ناردن</title></head><body style="font-family:sans-serif;text-align:center;padding:40px"><h1>سیستەمی ناردنی دەنگ ✅</h1><input id="num" placeholder="ژمارەی دەنگدەر" style="padding:12px;width:250px"><button onclick="send()" style="padding:12px">ناردن</button><div id="res" style="margin-top:20px;font-size:20px"></div><script>async function send(){let n=document.getElementById('num').value;let r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voterNumber:n})});let j=await r.json();document.getElementById('res').innerText=j.found?'✅ '+j.data.name:'❌ نەدۆزرایەوە'}</script><br><br><a href="/admin.html">Admin</a> | <a href="/admin-upload.html">Upload Excel</a></body></html>
