<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سێرڤەرەکەم</title>
<style>body{font-family:sans-serif;max-width:500px;margin:auto;padding:15px;background:#f0f2f5}.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,.1)}input{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}button{width:100%;padding:12px;background:#0078d4;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer}.item{background:#e8f4ff;padding:10px;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between}</style></head>
<body><div class="card"><h2 style="text-align:center">🚀 سێرڤەرەکەم ئیش دەکات!</h2><input id="name" placeholder="ناوت"><input id="msg" placeholder="نامەکەت"><button onclick="send()">ناردن بۆ سێرڤەر</button></div>
<div class="card"><h3>داتاکان:</h3><div id="list">چاوەڕێ بە...</div><button onclick="load()" style="background:#28a745;margin-top:10px">نوێکردنەوە</button></div>
<script>const API='/api/data';async function send(){const n=document.getElementById('name').value,m=document.getElementById('msg').value;if(!n||!m)return alert('پڕی بکەرەوە');await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,message:m})});document.getElementById('name').value='';document.getElementById('msg').value='';load()}async function load(){const r=await fetch(API);const d=await r.json();document.getElementById('list').innerHTML=d.reverse().map(i=>`<div class=item><span><b>${i.name}:</b> ${i.message}<br><small>${i.time}</small></span><button onclick="del(${i.id})" style="width:auto;background:#ff4444;padding:5px 10px">X</button></div>`).join('')||'هیچ نیە'}async function del(id){await fetch(API+'/'+id,{method:'DELETE'});load()}load();</script></body></html>
