<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سیستەمی دەنگدەر</title>
<style>
*{box-sizing:border-box;font-family:Tahoma}
body{background:#eef2f7;margin:0;padding:10px}
.card{background:#fff;border-radius:14px;padding:18px;margin:12px auto;max-width:500px;box-shadow:0 6px 18px rgba(0,0,0,.1)}
input{width:100%;padding:13px;margin:7px 0;border:1.5px solid #d0d7de;border-radius:10px;font-size:16px}
button{width:100%;padding:13px;background:#0a7cff;color:#fff;border:none;border-radius:10px;font-size:17px;font-weight:700;margin-top:8px}
</style>
</head>
<body>
<div id="loginCard" class="card">
<h2>🔐 چوونەژوورەوەی کارمەند</h2>
<div id="loginMsg"></div>
<input id="username" value="admin">
<input id="password" type="password" value="Anjam1234">
<button onclick="login()">چوونە ژوورەوە</button>
</div>
<div id="mainCard" class="card" style="display:none">
<h2>📋 فۆڕمی دەنگدەر - کەرکوک</h2>
<div id="mainMsg"></div>
<label>ژمارەی دەنگدەر</label>
<input id="voterNumber" value="19503975">
<label>ناوی سیانی</label>
<input id="voterName" value="نسرین بشیر فوزی">
<label>شار</label>
<input id="city" value="کەرکوک">
<label>مۆبایل</label>
<input id="mobile" placeholder="0770...">
<button onclick="submitVoter()">تۆمارکردن</button>
<div style="margin-top:12px"><b>داتاکان:</b> <span id="countInfo">چاوەڕوان بە...</span>
<button onclick="loadCount()">نوێکردنەوە</button></div>
</div>
<script>
async function login(){
  const u=document.getElementById('username').value, p=document.getElementById('password').value;
  const res=await fetch('/api/staff/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
  const data=await res.json();
  if(data.success){document.getElementById('loginCard').style.display='none';document.getElementById('mainCard').style.display='block';loadCount();}
}
async function submitVoter(){
  let city=document.getElementById('city').value, mobile=document.getElementById('mobile').value;
  if(city.match(/^9647/)||city.match(/^\d{12,}$/)){mobile=city;city="کەرکوک";document.getElementById('city').value=city;}
  mobile=mobile.replace(/\s/g,''); if(mobile.startsWith('964')) mobile='0'+mobile.substring(3); if(mobile.startsWith('77')) mobile='0'+mobile;
  document.getElementById('mobile').value=mobile;
  const res=await fetch('/api/voter',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('voterName').value,city,mobile,voterNumber:document.getElementById('voterNumber').value})});
  const d=await res.json(); document.getElementById('mainMsg').innerHTML='✅ تۆمارکرا: '+d.city+' - '+d.mobile;
}
async function loadCount(){const r=await fetch('/api/names/count');const d=await r.json();document.getElementById('countInfo').innerText=d.total;}
</script>
</body>
</html>
