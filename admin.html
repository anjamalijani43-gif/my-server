<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  --bg:#f1f4f9; --card:#fff; --text:#1c2733; --muted:#6b7a8c; --line:#e3e8ef;
  --brand:#1e3a8a; --brand2:#3b82f6;
  --green:#16a34a; --greenbg:#dcfce7; --red:#dc2626; --redbg:#fee2e2;
  --blue:#2563eb; --amberbg:#fef3c7; --shadow:0 2px 10px rgba(20,40,80,.08); --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1722;--card:#18222f;--text:#e7edf5;--muted:#93a1b3;--line:#273445;
    --greenbg:#12331f;--redbg:#3a1717;--amberbg:#3a2a0e;--shadow:0 2px 10px rgba(0,0,0,.4)}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans Arabic',Tahoma,Arial,sans-serif;font-size:15px}
.top{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:18px 16px 70px}
.top h1{margin:0;font-size:22px;font-weight:700}
.top p{margin:4px 0 0;opacity:.85;font-size:13px}
.page{max-width:1200px;margin:-52px auto 30px;padding:0 12px}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;text-align:center}
.stat small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.stat b{font-size:24px;font-weight:700}
.stat.g b{color:var(--green)} .stat.b b{color:var(--blue)}

/* toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.toolbar .sp{flex:1}
button{font-family:inherit;font-size:14px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;transition:.15s}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--shadow)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.ok{background:var(--green);border-color:var(--green);color:#fff}
button.danger{background:var(--red);border-color:var(--red);color:#fff}
button.ghost{background:transparent}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--card);border-radius:12px;padding:5px;box-shadow:var(--shadow);margin-bottom:12px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px}
.tabs button.on{background:var(--brand);color:#fff}

#err{display:none;background:var(--redbg);color:var(--red);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px}

/* tables */
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px;margin-bottom:12px}
.wrap{overflow:auto;max-height:68vh;border-radius:10px;border:1px solid var(--line)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px;min-width:900px}
th{position:sticky;top:0;background:var(--brand);color:#fff;padding:10px 8px;text-align:right;font-weight:600;white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right}
tr.g td{background:var(--greenbg)}
tr.r td{background:var(--redbg)}
tr.y td{background:var(--amberbg)}
td a{color:var(--blue);text-decoration:none;font-weight:600}
.ltr{direction:ltr;text-align:left}
tr.g td:first-child{box-shadow:inset -4px 0 0 var(--green)}
tr.r td:first-child{box-shadow:inset -4px 0 0 var(--red)}
.empty{text-align:center;color:var(--muted);padding:34px 10px}

.pager{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:2px 2px 10px}
.pager span{color:var(--muted);font-size:13px}

/* families */
.fam{margin-bottom:14px}
.famh{display:flex;justify-content:space-between;align-items:center;margin:0 2px 6px;font-weight:600}
.badge{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--greenbg);color:var(--green);font-weight:600}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin:0 2px 10px}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-left:5px;vertical-align:-1px}

/* lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.lcard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.lcard .hd{display:flex;justify-content:space-between;align-items:baseline}
.lcard .hd b{font-size:17px}
.lcard .cnt{font-size:22px;font-weight:700;color:var(--brand2)}
.lcard .cnt small{font-size:12px;color:var(--muted);font-weight:400;margin-right:4px}
.lcard input[type=file]{width:100%;margin:10px 0;font-size:13px;color:var(--muted)}
.lcard input[type=file]::file-selector-button{font-family:inherit;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:7px 10px;margin-left:8px;cursor:pointer}
.lcard .acts{display:flex;gap:6px}
.lcard .acts button{flex:1;padding:8px 6px}
progress{width:100%;height:10px;margin-top:10px;accent-color:var(--green)}
.ptxt{font-size:12.5px;color:var(--muted);margin-top:4px}
.note{background:var(--card);border-radius:12px;padding:11px 13px;color:var(--muted);font-size:13px;margin-bottom:12px;box-shadow:var(--shadow)}

/* toast */
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);background:#111c2b;color:#fff;padding:11px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:9;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:600px){
  .stat b{font-size:19px}
}
</style>
</head>
<body>
<div class="top">
  <h1>لیستی نێردراو</h1>
  <p>بەڕێوەبردنی دەنگدەران، خێزانەکان و لیستەکان</p>
</div>

<div class="page">
  <div class="stats">
    <div class="stat"><small>کۆی گشتی</small><b id="total">0</b></div>
    <div class="stat g"><small>نێردراو</small><b id="sentc">0</b></div>
    <div class="stat b"><small>ڕێژە</small><b id="pct">0%</b></div>
  </div>

  <div class="toolbar">
    <button id="bRefresh">↻ تازەکردنەوە</button>
    <button id="bUp" class="ok">⬆ بارکردنی Excel</button>
    <button id="bClear" class="danger">🗑 سڕینەوەی نێردراوەکان</button>
    <span class="sp"></span>
    <button id="bOut">دەرچوون</button>
  </div>
  <div id="err"></div>

  <div class="tabs">
    <button data-t="sent" class="on">نێردراوەکان</button>
    <button data-t="fam">لیستی خێزانی</button>
    <button data-t="lists">٧ لیست</button>
    <button data-t="log">تۆماری کارمەندان</button>
  </div>

  <div id="v-sent"></div>
  <div id="v-fam" style="display:none"></div>
  <div id="v-lists" style="display:none"></div>
  <div id="v-log" style="display:none"></div>
</div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
let FIELDS=[], tab='sent', sentOff=0, famOff=0, logOff=0, busy=false;
const H=()=>({'Content-Type':'application/json'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=(o,ks)=>{for(const k of ks){if(o[k]!==undefined&&o[k]!==null&&String(o[k]).trim()!=='')return o[k]}return ''};
const head=()=>'<tr>'+FIELDS.map(f=>'<th>'+f[0]+'</th>').join('')+'</tr>';
const cells=(o,cls)=>'<tr class="'+cls+'">'+FIELDS.map(f=>'<td>'+esc(pick(o,f[1]))+'</td>').join('')+'</tr>';
let toastT;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3200)}
function showErr(m){const e=$('err');e.textContent=m;e.style.display=m?'block':'none'}
async function getJSON(u){const r=await fetch(u);if(r.status===401){location.replace('/login.html');throw new Error('login')}if(!r.ok)throw new Error(u+' → '+r.status);return r.json()}
function pager(off,L,total,w){
  return '<div class="pager"><button onclick="go(\''+w+'\','+(off-L)+')" '+(off<=0?'disabled':'')+'>→ پێشوو</button>'+
   '<span>'+(total?off+1:0)+' - '+Math.min(off+L,total)+' لە '+total.toLocaleString()+'</span>'+
   '<button onclick="go(\''+w+'\','+(off+L)+')" '+(off+L>=total?'disabled':'')+'>دواتر ←</button></div>';
}
function go(w,o){ o=Math.max(0,o); if(w==='sent'){sentOff=o;loadSent()}else if(w==='log'){logOff=o;loadLog()}else{famOff=o;loadFam()} }

/* ===== ژمارەکان ===== */
async function stats(){
  try{
    const l=await getJSON('/api/lists');
    const total=l.reduce((a,x)=>a+x.count,0);
    const s=await getJSON('/api/sent?limit=1');
    $('total').textContent=total.toLocaleString();
    $('sentc').textContent=s.total.toLocaleString();
    $('pct').textContent=(total?(s.total/total*100).toFixed(1):0)+'%';
    showErr('');
  }catch(e){ showErr('هەڵە لە پەیوەندی بە داتابەیس: '+e.message) }
}

/* ===== ناردراوەکان (سەوز) ===== */
const fmtTime=t=>t?new Date(t).toLocaleString('en-GB',{timeZone:'Asia/Baghdad',hour12:false}):'';
function mapLink(m){
  const la=Number(m.lat), ln=Number(m.lng);
  if(m.lat===null||m.lat===undefined||!isFinite(la)||!isFinite(ln)) return '';
  return '<a target="_blank" rel="noopener" href="https://www.google.com/maps?q='+la+','+ln+'">نەخشە</a>'+
    (m.acc?' <small>±'+Math.round(m.acc)+'م</small>':'');
}
const metaHead='<th>کارمەند</th><th>کات</th><th>شوێن</th><th>ئامێر</th><th>IP</th>';
const metaCells=m=>'<td>'+esc(m.username||'')+'</td><td class="ltr">'+esc(fmtTime(m.at))+'</td><td>'+mapLink(m)+'</td><td>'+esc(m.device||'')+'</td><td class="ltr">'+esc(m.ip||'')+'</td>';

async function loadSent(){
  const L=100;
  try{
    const r=await getJSON('/api/sent?limit='+L+'&offset='+sentOff);
    $('v-sent').innerHTML='<div class="panel">'+pager(sentOff,L,r.total,'sent')+
      (r.rows.length?'<div class="wrap"><table><tr>'+FIELDS.map(f=>'<th>'+f[0]+'</th>').join('')+metaHead+'</tr>'+
        r.rows.map(x=>'<tr class="g">'+FIELDS.map(f=>'<td>'+esc(pick(x.data,f[1]))+'</td>').join('')+metaCells(x.meta)+'</tr>').join('')+'</table></div>'
                    :'<div class="empty">هێشتا هیچ دەنگدەرێک نەنێردراوە</div>')+'</div>';
  }catch(e){ showErr(e.message) }
}

/* ===== تۆماری کارمەندان ===== */
const RES={ok:['نێردرا','g'],dup:['پێشتر نێردرابوو','y'],notfound:['لە لیست نییە','r']};
async function loadLog(){
  const L=100;
  try{
    const r=await getJSON('/api/log?limit='+L+'&offset='+logOff);
    $('v-log').innerHTML='<div class="panel">'+pager(logOff,L,r.total,'log')+
      (r.rows.length?'<div class="wrap"><table><tr><th>کات</th><th>کارمەند</th><th>ژمارەی دەنگدەر</th><th>ئەنجام</th><th>شوێن</th><th>ئامێر</th><th>IP</th></tr>'+
        r.rows.map(x=>{const q=RES[x.result]||['',''];
          return '<tr class="'+q[1]+'"><td class="ltr">'+esc(fmtTime(x.at))+'</td><td>'+esc(x.username||'')+'</td><td class="ltr">'+esc(x.voter||'')+'</td><td>'+q[0]+'</td><td>'+mapLink(x)+'</td><td>'+esc(x.device||'')+'</td><td class="ltr">'+esc(x.ip||'')+'</td></tr>'}).join('')+'</table></div>'
                    :'<div class="empty">هێشتا هیچ تۆمارێک نییە</div>')+'</div>';
  }catch(e){ showErr(e.message) }
}

/* ===== لیستی خێزانی ===== */
async function loadFam(){
  const L=30;
  try{
    const r=await getJSON('/api/family-list?limit='+L+'&offset='+famOff);
    $('v-fam').innerHTML='<div class="panel"><div class="legend"><span><i class="dot" style="background:var(--green)"></i>ناردراو</span>'+
      '<span><i class="dot" style="background:var(--red)"></i>نەناردراو</span></div>'+
      pager(famOff,L,r.total,'fam')+
      (r.families.length?r.families.map(f=>{
        const s=f.members.filter(m=>m.sent).length;
        return '<div class="fam"><div class="famh"><span>ژمارەی خێزان: '+esc(f.family)+'</span><span class="badge">'+s+' / '+f.members.length+' ناردراو</span></div>'+
          '<div class="wrap" style="max-height:none"><table>'+head()+f.members.map(m=>cells(m.data,m.sent?'g':'r')).join('')+'</table></div></div>';
      }).join(''):'<div class="empty">هێشتا هیچ خێزانێک نییە</div>')+'</div>';
  }catch(e){ showErr(e.message) }
}

/* ===== ٧ لیست ===== */
async function loadLists(){
  try{
    const r=await getJSON('/api/lists');
    $('v-lists').innerHTML='<div class="note">فایل Excel (.xlsx)، CSV یان JSON. بۆ ١ ملیۆن دەنگدەر CSV زۆر خێراترە و کێشەی مێمۆری نییە (لە Excel: Save As ← CSV UTF-8).</div>'+
    '<div class="grid">'+r.map(l=>
     '<div class="lcard"><div class="hd"><b>لیستی '+l.list+'</b><span class="cnt">'+l.count.toLocaleString()+'<small>دەنگدەر</small></span></div>'+
     '<input type="file" accept=".xlsx,.xls,.csv,.json" id="f'+l.list+'">'+
     '<div class="acts"><button class="ok" onclick="upload('+l.list+')">بارکردن</button>'+
     '<button class="primary" onclick="download('+l.list+')">داگرتن</button>'+
     '<button class="danger" onclick="del('+l.list+')">سڕینەوە</button></div>'+
     '<div id="p'+l.list+'"></div></div>').join('')+'</div>';
  }catch(e){ showErr(e.message) }
}

/* ناسینەوەی ناوی ستوونەکان (عەرەبی / کوردی / ئینگلیزی) */
const ALIASES={
  voterNumber:['رقم الناخب','ژمارەی دەنگدەر','ژمارە','voterNumber'],
  name:['اسم الناخب','ناوی دەنگدەر','ناو','name','voterName'],
  birth:['مواليد','المواليد','موالید','birth'],
  familyNumber:['رقم العائلة','رقم العائلي','ژمارە خێزانی','ژمارەی خێزانی','ژمارەی خێزان','familyNumber'],
  regCenterNumber:['رقم مركز التسجيل','ژمارەی ناوەندی تۆماری دەنگدەران','ژمارەی ناوەندی تۆمار','regCenterNumber'],
  regCenterName:['اسم مركز التسجيل','ناوی تۆماری ناوەندی دەنگدەران','ناوی ناوەندی تۆمار','regCenterName'],
  pollingCenterNumber:['رقم مركز الاقتراع','ژمارەی بنکەی دەنگدان','pollingCenterNumber'],
  pollingCenterName:['اسم مركز الاقتراع','ناوی بنکەی دەنگدان','pollingCenterName'],
  pollingCenterAddress:['عنوان مركز الاقتراع','ناونیشانی بنکەی دەنگدان','pollingCenterAddress'],
  phone:['رقم الهاتف','ژمارەی مۆبایل','phone']
};
function norm(s){
  return String(s).normalize('NFKC')
    .replace(/[\u064B-\u065F\u0670\u0640]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/[ىیېێئ]/g,'ي').replace(/[ةەھ]/g,'ه')
    .replace(/[کگ]/g,'ك').replace(/[ؤۆ]/g,'و')
    .replace(/[^\p{L}\p{N}]/gu,'').toLowerCase();
}
const MAP={};
for(const k in ALIASES) ALIASES[k].forEach(a=>MAP[norm(a)]=k);
function mapRow(raw){
  const out={};
  for(const k in raw){
    const key=MAP[norm(k)]||String(k).trim();
    const v=raw[k];
    out[key]=(v===null||v===undefined)?'':String(v).trim();
  }
  return out;
}

async function upload(n){
  const file=$('f'+n).files[0]; if(!file) return toast('فایلێک هەڵبژێرە');
  const p=$('p'+n); const B=5000;
  let buf=[], posted=0, saved=0, firstKeys=null;
  busy=true;
  p.innerHTML='<progress id="bar'+n+'" max="100" value="0"></progress><div class="ptxt" id="txt'+n+'">خوێندنەوەی فایل...</div>';
  const bar=$('bar'+n), txt=$('txt'+n);
  async function post(batch){
    const r=await fetch('/api/lists/'+n+'/upload',{method:'POST',headers:H(),body:JSON.stringify({data:batch})});
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||('HTTP '+r.status))}
    const j=await r.json(); saved+=j.saved; posted+=batch.length;
  }
  async function flush(force){
    while(buf.length>=B||(force&&buf.length)){ await post(buf.splice(0,B)) }
  }
  function push(o){ if(!firstKeys) firstKeys=Object.keys(o); buf.push(o) }
  try{
    const ext=file.name.split('.').pop().toLowerCase();
    if(ext==='csv'||ext==='txt'){
      await new Promise((resolve,reject)=>{
        Papa.parse(file,{header:true,skipEmptyLines:true,
          chunk:async(res,parser)=>{
            parser.pause();
            try{
              for(const r of res.data) push(mapRow(r));
              await flush(false);
              bar.value=Math.min(100,(res.meta.cursor/file.size)*100);
              txt.textContent=posted.toLocaleString()+' ڕیکۆرد نێردرا';
              parser.resume();
            }catch(e){ parser.abort(); reject(e) }
          },
          complete:()=>resolve(), error:reject});
      });
    }else if(ext==='json'){
      const j=JSON.parse(await file.text()); const arr=Array.isArray(j)?j:j.data;
      if(!Array.isArray(arr)) throw new Error('فایلەکە دەبێت array بێت');
      bar.max=arr.length;
      for(const r of arr){ push(mapRow(r)); if(buf.length>=B){ await flush(false); bar.value=posted; txt.textContent=posted.toLocaleString()+' / '+arr.length.toLocaleString() } }
    }else{
      txt.textContent='خوێندنەوەی Excel (کەمێک کات دەوێت)...';
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      bar.max=rows.length;
      for(const r of rows){ push(mapRow(r)); if(buf.length>=B){ await flush(false); bar.value=posted; txt.textContent=posted.toLocaleString()+' / '+rows.length.toLocaleString() } }
    }
    await flush(true);
    let msg='تەواو بوو. پاشەکەوتکرا: '+saved.toLocaleString()+' لە '+posted.toLocaleString();
    if(saved===0) msg+=' — ستوونی «ژمارەی دەنگدەر» نەدۆزرایەوە. ستوونەکان: '+(firstKeys||[]).join(' | ');
    txt.textContent=msg; bar.value=bar.max;
    toast('بارکردن تەواو بوو');
  }catch(e){
    txt.textContent='هەڵە: '+e.message+' (نێردرا: '+posted.toLocaleString()+')';
  }
  busy=false; stats();
}
function download(n){location='/api/lists/'+n+'/download'}
async function del(n){
  if(!confirm('دڵنیایت لە سڕینەوەی لیستی '+n+' ؟'))return;
  const r=await fetch('/api/lists/'+n,{method:'DELETE',headers:H()});
  if(!r.ok)return toast('هەڵە: '+r.status);
  toast('لیستی '+n+' سڕایەوە'); loadLists(); stats();
}

/* ===== دوگمەکان و تابەکان ===== */
function setTab(t){
  tab=t;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  ['sent','fam','lists','log'].forEach(x=>$('v-'+x).style.display=(x===t)?'':'none');
  if(t==='sent'){sentOff=0;loadSent()}
  if(t==='fam'){famOff=0;loadFam()}
  if(t==='lists')loadLists();
  if(t==='log'){logOff=0;loadLog()}
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
$('bRefresh').onclick=()=>{stats(); if(tab==='sent')loadSent(); else if(tab==='fam')loadFam(); else if(tab==='log')loadLog(); else if(!busy)loadLists()};
$('bOut').onclick=async()=>{ await fetch('/api/logout',{method:'POST'}); location.replace('/login.html') };
$('bUp').onclick=()=>setTab('lists');
$('bClear').onclick=async()=>{
  if(!confirm('هەموو لیستی نێردراوەکان دەسڕدرێتەوە (دەنگدەرەکان نامێنن). دڵنیایت؟'))return;
  const r=await fetch('/api/clear',{method:'DELETE',headers:H()});
  if(!r.ok)return toast('هەڵە: '+r.status);
  toast('لیستی نێردراوەکان سڕایەوە');
  stats(); if(tab==='sent')loadSent(); if(tab==='fam')loadFam();
};

getJSON('/api/me').then(m=>{ if(m.role!=='admin'){ location.replace('/index.html'); throw new Error('redirect') } return getJSON('/api/fields') }).then(f=>{FIELDS=f;stats();loadSent()}).catch(e=>showErr('سێرڤەر ئامادە نییە (DATABASE_URL دانەنراوە؟): '+e.message));
setInterval(()=>{ if(!busy){ stats(); if(tab==='sent')loadSent(); if(tab==='log')loadLog() } },15000);
</script>
</body>
</html>
