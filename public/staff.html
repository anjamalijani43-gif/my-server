<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>سیستەمی دەنگدان</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-50 p-4"><div id="L" class="max-w-md mx-auto mt-20 bg-white p-6 rounded-xl shadow"><h1 class="text-2xl font-bold text-center">سیستەمی دەنگدان</h1><p class="text-center mb-4">بەشی کارمەند</p><input id="user" class="w-full border p-3 rounded mb-3" placeholder="staff"><input id="pass" type="password" class="w-full border p-3 rounded mb-3" placeholder="1234"><button onclick="doLogin()" class="w-full bg-blue-600 text-white p-3 rounded">چوونە ژوورەوە</button></div><div id="A" class="hidden max-w-2xl mx-auto"><h1 class="text-2xl font-bold text-center mb-4">سیستەمی دەنگدان</h1><div class="bg-white p-6 rounded-xl shadow"><input id="num" placeholder="ژمارەی دەنگدەر" class="w-full border-2 p-4 rounded-lg" oninput="findName()"><div id="box" class="mt-4 p-4 rounded-lg hidden"></div><button id="sendBtn" onclick="send()" class="hidden w-full mt-4 bg-green-600 text-white p-3 rounded">ناردن بۆ سێرڤەر</button></div><div id="msg" class="mt-4"></div></div><script>function doLogin(){let u=user.value.trim(),p=pass.value.trim();if(u==='staff'&&p==='1234'){L.style.display='none';A.classList.remove('hidden')}else alert('هەڵە - staff / 1234')}const voters=[{n:"1001",name:"محمد عبدالله احمد",phone:"07701234501",family:"FAM-001"},{n:"1002",name:"احمد عبدالله احمد",family:"FAM-001"},{n:"2001",name:"علي حسن محمد",family:"FAM-002"}];let cur=null;function findName(){let v=num.value.trim(),f=voters.find(x=>x.n===v);if(!v){box.classList.add('hidden');sendBtn.classList.add('hidden');return}box.classList.remove('hidden');if(f){cur=f;box.className="mt-4 p-4 rounded-lg bg-green-100 border";box.innerHTML="✅ ناو: <b>"+f.name+"</b>";sendBtn.classList.remove('hidden')}else{cur=null;box.className="mt-4 p-4 rounded-lg bg-red-100 border";box.innerHTML="❌ لە لیستەکەدا نییە";sendBtn.classList.add('hidden')}}async function send(){if(!cur)return;let r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cur)});if(r.ok){msg.innerHTML="<div class='bg-green-100 p-3 rounded'>✅ نێردرا بۆ سێرڤەر: "+cur.name+"</div>";num.value="";findName()}}</script></body></html>
