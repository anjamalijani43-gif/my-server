<!DOCTYPE html>
<html dir="rtl" lang="ku">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سیستەمی دەنگدان</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4">
<div id="L" class="max-w-md mx-auto mt-20 bg-white p-6 rounded-xl shadow">
<h1 class="text-2xl font-bold text-center">سیستەمی دەنگدان</h1>
<p class="text-center text-gray-600 mb-4">بەشی کارمەند</p>
<input id="user" class="w-full border p-3 rounded mb-3" placeholder="یوزەرنەیم">
<input id="pass" type="password" class="w-full border p-3 rounded mb-3" placeholder="پاسوورد">
<button onclick="doLogin()" class="w-full bg-blue-600 text-white p-3 rounded font-bold">چوونە ژوورەوە</button>
<p class="text-xs text-center mt-3 text-gray-500">staff / 1234</p>
</div>

<div id="A" class="hidden max-w-2xl mx-auto">
<h1 class="text-2xl font-bold text-center mb-6">سیستەمی دەنگدان</h1>
<div class="bg-white p-6 rounded-xl shadow">
<h3 class="font-bold mb-3">ژمارەی دەنگدەر داخل بکە - هەمووی قبول دەکات</h3>
<input id="num" placeholder="مثال: 1001" class="w-full border-2 p-4 rounded-lg text-lg">
<button onclick="send()" class="w-full mt-4 bg-green-600 text-white p-4 rounded-lg font-bold text-lg">ناردن بۆ سێرڤەر</button>
<div id="box" class="mt-4"></div>
</div>
<div id="msg" class="mt-4"></div>
</div>

<script>
function doLogin(){
 let u=document.getElementById('user').value.trim();
 let p=document.getElementById('pass').value.trim();
 if(u==='staff' && p==='1234'){L.style.display='none';A.classList.remove('hidden')}
 else alert('هەڵە - staff / 1234');
}
async function send(){
 let n=document.getElementById('num').value.trim();
 if(!n) return;
 let r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voterNumber:n})});
 let data=await r.json();
 let box=document.getElementById('box');
 let msg=document.getElementById('msg');
 if(data.found){
   box.innerHTML=`<div class="p-4 bg-green-100 border-2 border-green-500 rounded-lg">
   ✅ <b>${data.data.name||data.data.اسم_الناخب}</b> دۆزرایەوە<br>
   رقم العائلي: ${data.data.familyNumber||data.data.رقم_العائلي}<br>
   موبایل: ${data.data.phone||data.data.رقم_الهاتف}
   </div>`;
   msg.innerHTML=`<div class="bg-green-600 text-white p-3 rounded">✅ نێردرا بۆ سێرڤەر</div>`;
 } else {
   box.innerHTML=`<div class="p-4 bg-red-100 border-2 border-red-500 rounded-lg">
   ❌ <b>تێبینی:</b> ئەم ژمارەیە لەو لیستەی تۆ نییە کە لە سێرڤەرەکە هەتە<br>
   ژمارە: ${data.number}
   </div>`;
   msg.innerHTML=`<div class="bg-orange-500 text-white p-3 rounded">⚠️ نێردرا وەک ژمارەی نەدۆزراو</div>`;
 }
 document.getElementById('num').value='';
}
</script>
</body>
</html>
