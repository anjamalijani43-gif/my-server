<html dir="rtl" lang="ku">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
<div class="max-w-lg w-full">
<h1 class="text-4xl font-bold text-center mb-8">سیستەمی دەنگدان</h1>
<div class="grid gap-4">
<a href="staff.html" class="bg-blue-600 text-white p-6 rounded-xl text-center text-xl font-bold">چوونە ژوورەوە وەک کارمەند</a>
<a href="admin.html" class="bg-green-600 text-white p-6 rounded-xl text-center text-xl font-bold">چوونە ژوورەوە وەک سێرڤەر</a>

</html><!DOCTYPE html>
<html dir="rtl" lang="ku">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>سیستەمی دەنگدان - کارمەند</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4">
<div id="login" class="max-w-md mx-auto mt-20 bg-white p-6 rounded-xl shadow">
<h1 class="text-2xl font-bold text-center mb-2">سیستەمی دەنگدان</h1>
<p class="text-center text-gray-600 mb-4">بەشی کارمەند</p>
<input id="u" placeholder="یوزەرنەیم" class="w-full border p-3 rounded mb-3">
<input id="p" type="password" placeholder="پاسوورد" class="w-full border p-3 rounded mb-3">
<button onclick="login()" class="w-full bg-blue-600 text-white p-3 rounded font-bold">چوونە ژوورەوە</button>
<p class="text-xs text-gray-500 mt-3 text-center">staff / 1234</p>
</div>

<div id="app" class="hidden max-w-2xl mx-auto">
<h1 class="text-2xl font-bold text-center mb-6">سیستەمی دەنگدان</h1>
<div class="bg-white p-6 rounded-xl shadow">
<input id="num" placeholder="ژمارەی دەنگدەر: 1001" class="w-full border-2 p-4 rounded-lg text-lg" onkeyup="findName()">
<div id="nameBox" class="mt-4 p-4 rounded-lg hidden"></div>
<button id="sendBtn" onclick="send()" class="hidden w-full mt-4 bg-green-600 text-white p-3 rounded-lg font-bold">ناردن بۆ سێرڤەر</button>
</div>
<div id="msg" class="mt-4"></div>
</div>

<script>
const voters=[{n:"1001",name:"محمد عبدالله احمد"},{n:"1002",name:"احمد عبدالله احمد"},{n:"1003",name:"حسين عبدالله احمد"},{n:"2001",name:"علي حسن محمد"},{n:"2002",name:"حسن علي محمد"},{n:"3001",name:"فاضلة كريم صالح"}];
let current=null;
function login(){if(u.value=="staff"&&p.value=="1234"){loginDiv.classList.add("hidden");app.classList.remove("hidden")}else alert("هەڵە")}
const loginDiv=document.getElementById("login"); const app=document.getElementById("app");
function findName(){
  const v=num.value.trim(); const f=voters.find(x=>x.n==v);
  const box=document.getElementById("nameBox"); const btn=document.getElementById("sendBtn");
  if(!v){box.classList.add("hidden");btn.classList.add("hidden");return}
  box.classList.remove("hidden");
  if(f){current=f; box.className="mt-4 p-4 rounded-lg bg-green-100 border border-green-400"; box.innerHTML=`✅ ناو: <b>${f.name}</b>`; btn.classList.remove("hidden")}
  else{current=null; box.className="mt-4 p-4 rounded-lg bg-red-100 border border-red-400"; box.innerHTML=`❌ ئەم ژمارەیە لە لیستەکەدا نییە - ${v}`; btn.classList.add("hidden")}
}
function send(){
  if(!current) return;
  let sent=JSON.parse(localStorage.getItem("sentVoters")||"[]");
  sent.push(current); localStorage.setItem("sentVoters",JSON.stringify(sent));
  document.getElementById("msg").innerHTML=`<div class="bg-green-100 p-3 rounded border border-green-400">✅ نێردرا بۆ سێرڤەر: ${current.name}</div>`;
  document.getElementById("num").value=""; findName();
}
</script>
</body>
</html><!DOCTYPE html>
<html dir="rtl" lang="ku">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>سیستەمی دەنگدان - سێرڤەر</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4">
<div id="login" class="max-w-md mx-auto mt-20 bg-white p-6 rounded-xl shadow">
<h1 class="text-2xl font-bold text-center mb-2">سیستەمی دەنگدان</h1>
<p class="text-center text-gray-600 mb-4">بەشی سێرڤەر</p>
<input id="u" placeholder="یوزەرنەیم" class="w-full border p-3 rounded mb-3">
<input id="p" type="password" placeholder="پاسوورد" class="w-full border p-3 rounded mb-3">
<button onclick="login()" class="w-full bg-green-600 text-white p-3 rounded font-bold">چوونە ژوورەوە</button>
<p class="text-xs text-gray-500 mt-3 text-center">admin / admin123</p>
</div>

<div id="app" class="hidden max-w-6xl mx-auto">
<h1 class="text-2xl font-bold text-center mb-6">سیستەمی دەنگدان - سێرڤەر</h1>
<div id="list" class="bg-white p-4 rounded-xl shadow"></div>
<button onclick="clearAll()" class="mt-4 bg-red-600 text-white px-4 py-2 rounded">سڕینەوەی هەموو</button>
</div>

<script>
function login(){if(u.value=="admin"&&p.value=="admin123"){loginDiv.classList.add("hidden");app.classList.remove("hidden");show()}else alert("هەڵە")}
const loginDiv=document.getElementById("login"); const app=document.getElementById("app");
function show(){
  const sent=JSON.parse(localStorage.getItem("sentVoters")||"[]");
  if(!sent.length){list.innerHTML="<p class='text-gray-500'>هیچ نەنێردراوە</p>";return}
  list.innerHTML=`<p class='font-bold mb-3'>${sent.length} کەس نێردراوە:</p><div class='space-y-2'>${sent.map(s=>`<div class='p-3 bg-green-50 border border-green-300 rounded'>${s.n} - ${s.name} ✅</div>`).join('')}</div>`;
}
function clearAll(){localStorage.removeItem("sentVoters");show()}
</script>
</body>
</html>
