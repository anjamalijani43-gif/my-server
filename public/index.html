<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سیستەمی دەنگدەر</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
<div class="max-w-6xl mx-auto">
<h1 class="text-3xl font-bold text-center mb-2">سیستەمی دەنگدەر - کەرکوک ✅</h1>
<p class="text-center text-gray-600 mb-6">تاقیکردنەوە - 15 دەنگدەر</p>

<div class="bg-white p-6 rounded-xl shadow mb-6">
<textarea id="nums" class="w-full border-2 border-gray-300 p-4 rounded-lg h-32" placeholder="ژمارەی دەنگدەر بنووسە: 1001, 1002, 9999"></textarea>
<button onclick="check()" class="w-full mt-4 bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg font-bold text-lg">ناردن بۆ سێرڤەر</button>
</div>

<div id="result"></div>
</div>

<script>
const voters = [
{"n":"1001","name":"محمد عبدالله احمد","birth":"1985","fam":"FAM-001","regNum":"K-101","regName":"مركز تسجيل كركوك الأولى","pollNum":"P-501","pollName":"حي الواسطي","addr":"كركوك - حي الواسطي - قرب الجسر","phone":"07701234501"},
{"n":"1002","name":"احمد عبدالله احمد","birth":"1988","fam":"FAM-001","regNum":"K-101","regName":"مركز تسجيل كركوك الأولى","pollNum":"P-501","pollName":"حي الواسطي","addr":"حي الواسطي - قرب الجسر","phone":"07701234502"},
{"n":"1003","name":"حسين عبدالله احمد","birth":"1992","fam":"FAM-001","regNum":"K-101","regName":"مركز تسجيل كركوك الأولى","pollNum":"P-501","pollName":"حي الواسطي","addr":"كركوك - الابتدائية","phone":"07701234503"},
{"n":"1004","name":"عباس عبدالله احمد","birth":"1995","fam":"FAM-001","regNum":"K-101","regName":"مركز تسجيل كركوك الأولى","pollNum":"P-501","pollName":"حي الواسطي","addr":"مدرسة ازادي الابتدائية","phone":"07701234504"},
{"n":"1005","name":"فارس عبدالله احمد","birth":"1999","fam":"FAM-001","regNum":"K-101","regName":"مركز تسجيل كركوك الأولى","pollNum":"P-501","pollName":"حي الواسطي","addr":"مدرسة ازادي الابتدائية","phone":"07701234505"},
{"n":"2001","name":"علي حسن محمد","birth":"1978","fam":"FAM-002","regNum":"K-102","regName":"مركز تسجيل رحيم اوا","pollNum":"P-502","pollName":"رحيم اوا","addr":"كركوك - رحيم اوا - الشارع الرئيسي","phone":"07701234506"},
{"n":"2002","name":"حسن علي محمد","birth":"1982","fam":"FAM-002","regNum":"K-102","regName":"مركز تسجيل رحيم اوا","pollNum":"P-502","pollName":"رحيم اوا","addr":"مدرسة ثوراو الاعدادية","phone":"07701234507"},
{"n":"2003","name":"محمد علي محمد","birth":"1990","fam":"FAM-002","regNum":"K-102","regName":"مركز تسجيل رحيم اوا","pollNum":"P-502","pollName":"رحيم اوا","addr":"مدرسة ثوراو الاعدادية","phone":"07701234508"},
{"n":"3001","name":"فاضلة كريم صالح","birth":"1987","fam":"FAM-003","regNum":"K-103","regName":"مركز تسجيل القادسية","pollNum":"P-503","pollName":"القادسية","addr":"كركوك - القادسية - قرب المستوصف","phone":"07701234509"},
{"n":"3002","name":"زينب كريم صالح","birth":"1991","fam":"FAM-003","regNum":"K-103","regName":"مركز تسجيل القادسية","pollNum":"P-503","pollName":"القادسية","addr":"حي القادسية - قرب المستوصف","phone":"07701234510"}
];

function check(){
  const input = document.getElementById('nums').value.split(/[\n,،]+/).map(s=>s.trim()).filter(Boolean);
  const found = voters.filter(v=> input.includes(v.n));
  const notFound = input.filter(x=> !voters.some(v=> v.n==x));
  const famNums = [...new Set(found.map(f=>f.fam))];
  
  let html = '';
  if(notFound.length){
    html += `<div class="bg-red-100 border-2 border-red-400 p-4 rounded-lg mb-4"><h3 class="font-bold text-red-700">ئەم ژمارانە لە لیستەکەدا نین:</h3><p class="mt-2">${notFound.map(n=> `<span class="bg-red-200 px-3 py-1 rounded mr-2">${n}: ئەم ژمارەیە لە لیستەکەدا نییە ❌</span>`).join('')}</p></div>`;
  }
  if(found.length){
    html += `<div class="bg-white p-4 rounded-xl shadow mb-4 overflow-auto"><h3 class="font-bold text-green-700 mb-3">✅ ${found.length} کەس دۆزرایەوە - نێردراو (سەوز)</h3><table class="w-full text-sm border"><thead class="bg-green-600 text-white"><tr><th class="p-2">رقم الناخب</th><th class="p-2">اسم الناخب</th><th class="p-2">مواليد</th><th class="p-2">رقم العائلي</th><th class="p-2">مركز التسجيل</th><th class="p-2">مركز الاقتراع</th><th class="p-2">الهاتف</th></tr></thead><tbody>${found.map(v=>`<tr class="bg-green-50 border-b"><td class="p-2">${v.n}</td><td class="p-2">${v.name}</td><td class="p-2">${v.birth}</td><td class="p-2">${v.fam}</td><td class="p-2">${v.regName}</td><td class="p-2">${v.pollName}</td><td class="p-2">${v.phone}</td></tr>`).join('')}</tbody></table></div>`;
    
    famNums.forEach(fam=>{
      const famMembers = voters.filter(v=> v.fam==fam);
      html += `<div class="bg-white p-4 rounded-xl shadow mb-4"><h3 class="font-bold mb-3">خێزان: ${fam} - ${famMembers.length} کەس</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-2">${famMembers.map(m=>{
        const sent = found.some(f=> f.n==m.n);
        return `<div class="p-3 rounded-lg border ${sent?'bg-green-100 border-green-400':'bg-red-100 border-red-400'}"><b>${m.n}</b> - ${m.name} ${sent?'✅ نێردراو':'❌ نەنێردراو'}</div>`;
      }).join('')}</div></div>`;
    });
  }
  document.getElementById('result').innerHTML = html || '<p class="text-center text-gray-500">هیچ ژمارەیەک نەنووسراوە</p>';
}
</script>
</body>
</html>
