<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>سیستەمی دەنگدان</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-50 p-4"><div id="L" class="max-w-md mx-auto mt-20 bg-white p-6 rounded-xl shadow"><h1 class="text-2xl font-bold text-center">سیستەمی دەنگدان</h1><p class="text-center mb-4">بەشی سێرڤەر</p><input id="user" class="w-full border p-3 rounded mb-3" placeholder="admin"><input id="pass" type="password" class="w-full border p-3 rounded mb-3" placeholder="admin123"><button onclick="doLogin()" class="w-full bg-green-600 text-white p-3 rounded">چوونە ژوورەوە</button></div><div id="A" class="hidden max-w-5xl mx-auto"><h1 class="text-2xl font-bold text-center mb-4">سیستەمی دەنگدان - سێرڤەر</h1><div class="bg-white p-4 rounded-xl shadow"><div class="flex justify-between mb-4"><button onclick="load()" class="bg-blue-600 text-white px-4 py-2 rounded">نوێکردنەوە</button><button onclick="clearAll()" class="bg-red-600 text-white px-4 py-2 rounded">سڕینەوە</button></div><div id="list"></div></div></div><script>function doLogin(){let u=user.value.trim(),p=pass.value.trim();if(u==='admin'&&p==='admin123'){L.style.display='none';A.classList.remove('hidden');load()}else alert('admin / admin123')}async function load(){let r=await fetch('/api/list');let data=await r.json();let d=document.getElementById('list');if(!data.length){d.innerHTML="<p class='text-center text-gray-500 p-8'>هیچ نەنێردراوە - کارمەند هێشتا هیچی نەناردووە</p>";return}d.innerHTML="<p class='font-bold mb-3'>"+data.length+" کەس نێردراوە:</p>"+data.map((x,i)=>"<div class='p-3 bg-green-50 border border-green-300 mb-2 rounded flex justify-between'><span>"+(i+1)+". "+x.n+" - "+x.name+" ✅</span><span class='text-sm text-gray-600'>"+(x.family||"")+"</span></div>").join('')}async function clearAll(){if(!confirm('دڵنیای؟'))return;await fetch('/api/clear',{method:'DELETE'});load()}</script></body></html>
