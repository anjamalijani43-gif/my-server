<!DOCTYPE html>
<html dir="rtl" lang="ku">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>سیستەمی دەنگدان</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-4">
<div id="L" class="max-w-md mx-auto mt-20 bg-white p-6 rounded-xl shadow">
<h1 class="text-2xl font-bold text-center">سیستەمی دەنگدان</h1>
<p class="text-center mb-4">بەشی سێرڤەر</p>
<input id="user" class="w-full border p-3 rounded mb-3" placeholder="admin">
<input id="pass" type="password" class="w-full border p-3 rounded mb-3" placeholder="admin123">
<button onclick="doLogin()" class="w-full bg-green-600 text-white p-3 rounded">چوونە ژوورەوە</button>
</div>
<div id="A" class="hidden max-w-4xl mx-auto">
<h1 class="text-2xl font-bold text-center mb-4">سیستەمی دەنگدان - سێرڤەر</h1>
<div id="list" class="bg-white p-4 rounded-xl shadow"></div>
</div>
<script>
function doLogin(){
 let u=document.getElementById('user').value.trim();
 let p=document.getElementById('pass').value.trim();
 if(u==='admin' && p==='admin123'){document.getElementById('L').style.display='none';document.getElementById('A').classList.remove('hidden');show()}
 else{alert('هەڵە - admin / admin123 بنووسە')}
}
function show(){
 let s=JSON.parse(localStorage.getItem("sentVoters")||"[]");
 let d=document.getElementById('list');
 if(!s.length){d.innerHTML="هیچ نەنێردراوە";return}
 d.innerHTML=s.map(x=>"<div class='p-3 bg-green-50 border mb-2 rounded'>"+x.n+" - "+x.name+" ✅</div>").join('');
}
</script>
</body>
</html>
