<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>Admin</title></head><body style="font-family:sans-serif;max-width:900px;margin:auto;padding:20px"><h2>لیستی نێردراو</h2><button onclick="load()">تازەکردنەوە</button><button onclick="clearAll()">سڕینەوە</button> <a href="/admin-upload.html">بارکردنی Excel</a><div id="info"></div><div id="list"></div><script>async function load(){let r=await fetch('/api/list');let j=await r.json();document.getElementById('info').innerText='کۆی گشتی: '+j.allCount+' | نێردراو: '+j.sent.length;let h='<table border=1 style="width:100%;border-collapse:collapse"><tr><th>ژمارە</th><th>ناو</th></tr>';j.sent.forEach(s=>{h+=`<tr><td>${s.voterNumber}</td><td>${s.name}</td></tr>`});h+='</table>';document.getElementById('list').innerHTML=h}async function clearAll(){if(confirm('دڵنیای؟')){await fetch('/api/clear',{method:'DELETE'});load()}}load()</script></body></html>
